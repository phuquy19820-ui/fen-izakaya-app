services:
  - type: web
    name: fen-izakaya-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false # nhập chuỗi kết nối Neon trong Render > Environment, KHÔNG ghi vào file này
      - key: PORT
        value: "5000"
      - key: NODE_ENV
        value: production
